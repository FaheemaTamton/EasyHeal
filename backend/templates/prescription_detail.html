{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prescription Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root {
  --theme-color: #8FABD4;
}

body {
  min-height: 100vh;
  background-color: rgb(239, 236, 227);
}

.wrapper {
  max-width: 1100px;
  margin: 60px auto;
}

.section-title {
  font-weight: 700;
  margin-bottom: 20px;
}

/* ===== IMAGE ===== */
.prescription-image {
  text-align: center;
  margin-bottom: 40px;
}

.prescription-image img {
  max-width: 100%;
  max-height: 400px;
  border-radius: 12px;
  box-shadow: 0 8px 22px rgba(0,0,0,0.1);
}

/* ===== TABLE DESIGN (Same Style) ===== */
.medicine-table {
  display: grid;
  grid-template-columns: 2fr 1.5fr 2fr 2fr 1.5fr;
  gap: 14px;
}

.medicine-col {
  background: #ffffff;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 8px 22px rgba(0,0,0,0.06);
}


  <!-- ================= BACK BUTTON ================= -->
  <div class="text-center back-btn">
   <a href="/patient/{{ prescription.patient.id }}/"
   class="btn btn-secondary">
    Back
</a>

  </div>

</div>

</body>
</html>
